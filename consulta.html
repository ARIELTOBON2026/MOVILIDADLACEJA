        rel="stylesheet"
    >


    <!-- ==================================================
         ESTILOS PROPIOS
    =================================================== -->

    <link

        href="style.css"
    >

</head>


<body>

     NAVBAR
====================================================== -->

            href="index.html"
        >

            MOVILIDAD LA CEJA

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Alternar navegación"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menu"
        >

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html"

                        Inicio

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="consulta.html"

                    >

                        Consulta Vehículos

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="radicados.html"
                    >

                </li>


                <li class="nav-item">

                    >

                        Descargas

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- ======================================================
     ENCABEZADO
====================================================== -->

<header
    class="text-center text-white py-5 bg-primary"
>

    <h1>

        <i class="bi bi-search"></i>

        CONSULTA DE VEHÍCULOS

    </h1>


    <p class="mb-0">

        Secretaría de Movilidad La Ceja

    </p>

</header>



<!-- ======================================================
     CONSULTA
====================================================== -->

<main class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div
                class="card shadow-lg border-0 rounded-4"
            >

                <div
                    class="card-body p-4 p-md-5"
                >


                    <div
                        class="text-center mb-4"
                    >

                        <i
                            class="bi bi-car-front-fill display-1 text-primary"
                        ></i>


                        <h2 class="mt-3">

                            Consultar por Placa

                        </h2>


                        <p class="text-muted">

                            Ingrese la placa del vehículo

                        </p>

                    </div>



                    <!-- ==================================
                         CAMPO PLACA
                    =================================== -->

                    <div class="input-group input-group-lg">


                        <input
                            type="text"
                            id="placa"
                            class="form-control"
                            maxlength="10"
                            placeholder="Ejemplo: ABC123"
                            style="text-transform:uppercase;"
                            autocomplete="off"
                            aria-label="Placa del vehículo"
                        >


                        <button
                            class="btn btn-primary"
                            type="button"
                            onclick="consultarPlaca()"
                        >

                            <i class="bi bi-search"></i>

                            Consultar

                        </button>


                    </div>



                    <!-- ==================================
                         BOTÓN NUEVA CONSULTA
                    =================================== -->

                    <div class="mt-3 d-grid">


                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="limpiarConsultaVehiculo()"
                        >

                            <i class="bi bi-arrow-clockwise"></i>

                            Nueva Consulta

                        </button>


                    </div>



                    <!-- ==================================
                         LOADER
                    =================================== -->

                    <div
                        class="text-center mt-4"
                    >

                        <div
                            id="loader"
                            class="spinner-border text-primary"
                            style="display:none;"
                            role="status"
                            aria-label="Consultando"
                        ></div>

                    </div>



                    <!-- ==================================
                         RESULTADO
                    =================================== -->

                    <div
                        id="resultado"
                        class="mt-4"
                        style="display:none;"
                    ></div>


                </div>

            </div>

        </div>

    </div>

</main>



<!-- ======================================================
     PIE DE PÁGINA
====================================================== -->

<footer
    class="mt-5 py-4 bg-light border-top"
>

    <div class="container text-center">


        <h5 class="fw-bold text-primary">

            SECRETARÍA DE MOVILIDAD LA CEJA

        </h5>


        <p class="text-muted mb-1">

            Sistema de Consulta Vehicular

        </p>


        <p class="text-muted small">

            <span id="fecha"></span>

        </p>


        <a
            href="index.html"
            class="btn btn-light border shadow-sm"
        >

            <i class="bi bi-house-door-fill"></i>

            Volver al Inicio

        </a>


    </div>

</footer>



<!-- ======================================================
     BOTÓN ARRIBA
====================================================== -->

<button
    id="btnTop"
    class="btn btn-primary rounded-circle shadow"
    onclick="volverArriba()"
    style="
        display:none;
        position:fixed;
        right:20px;
        bottom:20px;
        z-index:1050;
        width:48px;
        height:48px;
    "
    aria-label="Volver arriba"
>

    <i class="bi bi-arrow-up"></i>

</button>
